name: Sync models.dev mirror

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, offset minute
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch and validate models.dev candidate
        run: |
          curl --compressed --fail --show-error --location --retry 3 --retry-all-errors --max-time 60 https://models.dev/api.json -o models.json.new
          node scripts/validate-candidate.mjs models.json.new
          mv models.json.new models.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models.json
          if git diff --staged --quiet; then
            echo "models.json unchanged"
          else
            git commit -m "chore: sync models.dev snapshot"
            git push
          fi
