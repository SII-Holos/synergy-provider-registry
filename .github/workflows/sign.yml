name: Sign catalog

on:
  push:
    branches: [main]
    paths: [catalog.v1.json, models.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog against models.json
        run: node scripts/validate.mjs

      - name: Sign catalog
        env:
          CATALOG_PRIVATE_KEY: ${{ secrets.CATALOG_PRIVATE_KEY }}
        run: node scripts/sign.mjs

      - name: Commit signature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.v1.json.sig
          if git diff --staged --quiet; then
            echo "signature unchanged"
          else
            git commit -m "chore: sign catalog.v1.json"
            git push
          fi
